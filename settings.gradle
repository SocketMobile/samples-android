pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://bin.socketmobile.com/repo/releases'
        }
    }
}

rootProject.name = 'samples-android'
include ':hellocapture'
include ':hellocapture-ble-android'
include ':hellocapture-plainjava'
